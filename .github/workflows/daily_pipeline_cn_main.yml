name: Daily Pipeline - A-Share (CN)

# NOTE: Recreated under a new workflow path to force GitHub to register
# a fresh workflow ID after the old CN workflow stopped honoring schedule.
# 编排层：组合数据同步 + AI 分析，形成完整的每日流水线
# 安全：通过 Trading Day Gate 闸门确保仅在 CN 市场交易日执行

on:
  schedule:
    # 每日北京时间 16:00 (UTC 08:00) 执行 - A股15:00收盘后1小时
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 支持手动触发

concurrency:
  group: daily-pipeline-cn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Step 0: Trading Day Gate (仅 schedule 触发时检查)
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'CN'
    secrets: inherit

  # Step 1: 数据同步
  sync:
    needs: [gate]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    uses: ./.github/workflows/data_sync_cn.yml
    secrets: inherit

  # Step 2: 验证历史预测 (数据同步后立即执行)
  verify:
    needs: sync
    if: needs.sync.result == 'success'
    uses: ./.github/workflows/verify_predictions.yml
    secrets: inherit

  # Step 3: AI 分析 (仅当数据同步成功后执行)
  analyze:
    needs: sync
    if: needs.sync.result == 'success'
    uses: ./.github/workflows/ai_analyze_cn.yml
    secrets: inherit

  # Step 4: 大盘黄历 (与分析并行，避免互相阻塞)
  almanac:
    needs: sync
    if: needs.sync.result == 'success'
    uses: ./.github/workflows/daily_almanac_cn.yml
    secrets: inherit
