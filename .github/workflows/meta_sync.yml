name: Daily Stock Metadata Sync

on:
  schedule:
    # 每日北京时间 06:00 (UTC 22:00 前一天) 执行
    - cron: '0 22 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  sync-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Sync stock metadata (name + name_en, HK Sina + curated CN/HK JSON)
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
        run: |
          # Writes stock_meta including nullable name_en; see docs/1_Engineering/i18n/04_Stock_Name_En_Production_Release_Checklist.md
          python backend/main.py --sync-meta
