name: Daily Pipeline - Hong Kong (HK)

# 编排层：组合数据同步 + AI 分析，形成完整的每日流水线
# 安全：通过 Trading Day Gate 闸门确保仅在 HK 市场交易日执行

on:
  schedule:
    # 每日北京时间 16:30 (UTC 08:30) 执行 - 港股16:00收盘后30分钟
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支持手动触发

concurrency:
  group: daily-pipeline-hk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Step 0: Trading Day Gate (仅 schedule 触发时检查)
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'HK'
    secrets: inherit

  # Step 1: 数据同步
  sync:
    needs: [gate]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    uses: ./.github/workflows/data_sync_hk.yml
    secrets: inherit

  # Step 2: 验证历史预测 (按市场切片执行，避免与 CN 主链重复)
  verify:
    needs: sync
    if: success()
    uses: ./.github/workflows/verify_predictions.yml
    with:
      market: 'HK'
    secrets: inherit

  # Step 3: AI 分析 (仅当数据同步成功后执行)
  analyze:
    needs: sync
    if: success()
    uses: ./.github/workflows/ai_analyze_hk.yml
    secrets: inherit
