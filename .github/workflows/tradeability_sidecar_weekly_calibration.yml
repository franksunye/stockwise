name: Tradeability Sidecar Weekly Calibration

on:
  schedule:
    - cron: '0 2 * * 0' # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      market:
        description: 'Target market'
        type: choice
        required: true
        default: 'BOTH'
        options:
        - CN
        - HK
        - BOTH
      strategy_versions:
        description: 'Comma-separated strategy versions for calibration'
        type: string
        required: false
        default: 'tradeability_v1,tradeability_v2'
      start_date:
        description: 'YYYY-MM-DD (optional)'
        type: string
        required: false
        default: ''
      end_date:
        description: 'YYYY-MM-DD (optional)'
        type: string
        required: false
        default: ''
      parameter_order:
        description: 'Comma-separated single-parameter order'
        type: string
        required: false
        default: 'breakout_volume_mult,momentum_change_threshold,strong_close_threshold,vcp_ratio,risk_off_ma'

concurrency:
  group: tradeability-sidecar-weekly-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calibrate-cn:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.market == 'CN' || inputs.market == 'BOTH'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Weekly Calibration CN
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p tmp/tradeability_calibration
          START_ARGS=()
          if [ -n "${{ inputs.start_date }}" ]; then
            START_ARGS+=(--start-date "${{ inputs.start_date }}")
          fi
          END_ARGS=()
          if [ -n "${{ inputs.end_date }}" ]; then
            END_ARGS+=(--end-date "${{ inputs.end_date }}")
          fi
          STRATEGIES="${{ inputs.strategy_versions }}"
          if [ -z "$STRATEGIES" ]; then
            STRATEGIES="tradeability_v1,tradeability_v2"
          fi
          PARAM_ORDER="${{ inputs.parameter_order }}"
          if [ -z "$PARAM_ORDER" ]; then
            PARAM_ORDER="breakout_volume_mult,momentum_change_threshold,strong_close_threshold,vcp_ratio,risk_off_ma"
          fi
          python -u backend/scripts/run_tradeability_weekly_calibration.py \
            --market CN \
            --strategy-versions "$STRATEGIES" \
            --parameter-order "$PARAM_ORDER" \
            "${START_ARGS[@]}" "${END_ARGS[@]}" \
            --output-json tmp/tradeability_calibration/cn_weekly_calibration.json \
            --output-md tmp/tradeability_calibration/cn_weekly_calibration.md

      - name: Upload CN Calibration Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeability-weekly-calibration-cn
          path: tmp/tradeability_calibration/cn_*
          if-no-files-found: error
          retention-days: 14

  calibrate-hk:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Weekly Calibration HK
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p tmp/tradeability_calibration
          START_ARGS=()
          if [ -n "${{ inputs.start_date }}" ]; then
            START_ARGS+=(--start-date "${{ inputs.start_date }}")
          fi
          END_ARGS=()
          if [ -n "${{ inputs.end_date }}" ]; then
            END_ARGS+=(--end-date "${{ inputs.end_date }}")
          fi
          STRATEGIES="${{ inputs.strategy_versions }}"
          if [ -z "$STRATEGIES" ]; then
            STRATEGIES="tradeability_v1,tradeability_v2"
          fi
          PARAM_ORDER="${{ inputs.parameter_order }}"
          if [ -z "$PARAM_ORDER" ]; then
            PARAM_ORDER="breakout_volume_mult,momentum_change_threshold,strong_close_threshold,vcp_ratio,risk_off_ma"
          fi
          python -u backend/scripts/run_tradeability_weekly_calibration.py \
            --market HK \
            --strategy-versions "$STRATEGIES" \
            --parameter-order "$PARAM_ORDER" \
            "${START_ARGS[@]}" "${END_ARGS[@]}" \
            --output-json tmp/tradeability_calibration/hk_weekly_calibration.json \
            --output-md tmp/tradeability_calibration/hk_weekly_calibration.md

      - name: Upload HK Calibration Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeability-weekly-calibration-hk
          path: tmp/tradeability_calibration/hk_*
          if-no-files-found: error
          retention-days: 14

  notify-summary:
    needs: [calibrate-cn, calibrate-hk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Notify ADMIN Summary
        env:
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          MARKET_INPUT: ${{ inputs.market || 'BOTH' }}
          RUN_CN_RESULT: ${{ needs.calibrate-cn.result || 'skipped' }}
          RUN_HK_RESULT: ${{ needs.calibrate-hk.result || 'skipped' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SOURCE: ${{ github.event_name }}
        run: |
          STATUS="success"
          MESSAGE="Tradeability 周校准已完成"
          for result in "$RUN_CN_RESULT" "$RUN_HK_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              STATUS="failed"
              MESSAGE="Tradeability 周校准存在失败或取消的分支，请排查"
              break
            fi
          done

          python -u backend/scripts/send_admin_workflow_notification.py \
            --task-name "Tradeability 周校准" \
            --status "$STATUS" \
            --message "$MESSAGE" \
            --rerun-workflow "tradeability_sidecar_weekly_calibration.yml" \
            --meta workflow=tradeability_sidecar_weekly_calibration.yml \
            --meta trigger_source="$TRIGGER_SOURCE" \
            --meta market="$MARKET_INPUT" \
            --meta calibration_cn="$RUN_CN_RESULT" \
            --meta calibration_hk="$RUN_HK_RESULT" \
            --meta run_url="$RUN_URL"
