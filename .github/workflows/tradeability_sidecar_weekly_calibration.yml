name: Tradeability Sidecar Weekly Calibration

on:
  schedule:
    - cron: '0 2 * * 0' # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      market:
        description: 'Target market'
        type: choice
        required: true
        default: 'BOTH'
        options:
        - CN
        - HK
        - BOTH
      strategy_version:
        description: 'Strategy version for report labeling'
        type: string
        required: false
        default: 'tradeability_v1'
      start_date:
        description: 'YYYY-MM-DD (optional)'
        type: string
        required: false
        default: ''
      end_date:
        description: 'YYYY-MM-DD (optional)'
        type: string
        required: false
        default: ''
      min_trades_per_window:
        description: 'Minimum trades per window'
        type: string
        required: false
        default: '6'

concurrency:
  group: tradeability-sidecar-weekly-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calibrate-cn:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.market == 'CN' || inputs.market == 'BOTH'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Weekly Calibration CN
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p tmp/tradeability_calibration
          START_ARG=""
          if [ -n "${{ inputs.start_date }}" ]; then
            START_ARG="--start-date ${{ inputs.start_date }}"
          fi
          END_ARG=""
          if [ -n "${{ inputs.end_date }}" ]; then
            END_ARG="--end-date ${{ inputs.end_date }}"
          fi
          STRATEGY="${{ inputs.strategy_version }}"
          if [ -z "$STRATEGY" ]; then
            STRATEGY="tradeability_v1"
          fi
          MIN_TRADES="${{ inputs.min_trades_per_window }}"
          if [ -z "$MIN_TRADES" ]; then
            MIN_TRADES="6"
          fi
          python -u backend/scripts/run_tradeability_weekly_calibration.py \
            --market CN \
            --strategy-version "$STRATEGY" \
            --min-trades-per-window "$MIN_TRADES" \
            $START_ARG $END_ARG \
            --output-json tmp/tradeability_calibration/cn_weekly_calibration.json \
            --output-md tmp/tradeability_calibration/cn_weekly_calibration.md \
            --emit-updated-params tmp/tradeability_calibration/cn_updated_params.json

      - name: Upload CN Calibration Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeability-weekly-calibration-cn
          path: tmp/tradeability_calibration/cn_*
          if-no-files-found: error
          retention-days: 14

  calibrate-hk:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Weekly Calibration HK
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p tmp/tradeability_calibration
          START_ARG=""
          if [ -n "${{ inputs.start_date }}" ]; then
            START_ARG="--start-date ${{ inputs.start_date }}"
          fi
          END_ARG=""
          if [ -n "${{ inputs.end_date }}" ]; then
            END_ARG="--end-date ${{ inputs.end_date }}"
          fi
          STRATEGY="${{ inputs.strategy_version }}"
          if [ -z "$STRATEGY" ]; then
            STRATEGY="tradeability_v1"
          fi
          MIN_TRADES="${{ inputs.min_trades_per_window }}"
          if [ -z "$MIN_TRADES" ]; then
            MIN_TRADES="6"
          fi
          python -u backend/scripts/run_tradeability_weekly_calibration.py \
            --market HK \
            --strategy-version "$STRATEGY" \
            --min-trades-per-window "$MIN_TRADES" \
            $START_ARG $END_ARG \
            --output-json tmp/tradeability_calibration/hk_weekly_calibration.json \
            --output-md tmp/tradeability_calibration/hk_weekly_calibration.md \
            --emit-updated-params tmp/tradeability_calibration/hk_updated_params.json

      - name: Upload HK Calibration Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeability-weekly-calibration-hk
          path: tmp/tradeability_calibration/hk_*
          if-no-files-found: error
          retention-days: 14
