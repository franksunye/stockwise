name: StockWise Realtime Sync

on:
  # Trigger Source: Cloudflare Worker Only (Global Realtime Sweep)
  # 调度由 Cloudflare Worker 全权负责 (15min 间隔)
  workflow_dispatch: # 由 Cloudflare Worker 或手动触发
    inputs:
      market:
        description: '可选市场过滤 (ALL/CN/HK/US)'
        type: choice
        required: false
        default: 'ALL'
        options:
          - ALL
          - CN
          - HK
          - US
  workflow_call:
    inputs:
      market:
        description: '可选市场过滤 (ALL/CN/HK/US)'
        required: false
        type: string
        default: 'ALL'

concurrency:
  group: realtime-sync
  cancel-in-progress: true


jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Realtime Sync
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INPUT_MARKET: ${{ inputs.market || 'ALL' }}
        run: |
          if [ "$INPUT_MARKET" = "ALL" ] || [ -z "$INPUT_MARKET" ]; then
            python backend/main.py --realtime
          else
            python backend/main.py --realtime --market "$INPUT_MARKET"
          fi
