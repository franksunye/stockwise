name: Daily Pipeline - US Market

# 编排层：组合数据同步 + 验证 + AI 分析，形成美股独立每日流水线
# 安全：通过 Trading Day Gate 闸门确保仅在 US 市场交易日执行

on:
  schedule:
    # UTC 22:30 (北京时间次日 06:30)；覆盖美东收盘后窗口（含夏令时/冬令时）
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # 支持手动触发

concurrency:
  group: daily-pipeline-us-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Step 0: Trading Day Gate (仅 schedule 触发时检查)
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'US'
    secrets: inherit

  # Step 1: 数据同步
  sync:
    needs: [gate]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    uses: ./.github/workflows/data_sync_us.yml
    secrets: inherit

  # Step 2: 验证历史预测 (按市场切片执行)
  verify:
    needs: sync
    if: success()
    uses: ./.github/workflows/verify_predictions.yml
    with:
      market: 'US'
    secrets: inherit

  # Step 3: AI 分析 (仅当数据同步成功后执行)
  analyze:
    needs: sync
    if: success()
    uses: ./.github/workflows/ai_analyze_us.yml
    secrets: inherit
