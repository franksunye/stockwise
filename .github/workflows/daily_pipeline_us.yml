name: Daily Pipeline - US Market

# 编排层：组合数据同步 + 验证 + AI 分析，形成美股独立每日流水线
# 安全：通过 Trading Day Gate 闸门确保仅在 US 市场交易日执行

on:
  # Trigger Source: Cloudflare Worker Only (US Main Chain)
  # 每日 06:30 BJT 结算节奏由 Worker 控制触发
  workflow_dispatch: # 支持手动触发

concurrency:
  group: daily-pipeline-us-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Step 0: Trading Day Gate (仅 schedule 触发时检查)
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'US'
    secrets: inherit

  # Step 1: 数据同步
  sync:
    needs: [gate]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    uses: ./.github/workflows/data_sync_us.yml
    secrets: inherit

  # Step 1.5: 市场事实健康检查 (US)
  healthcheck:
    needs: sync
    # success() is false when upstream jobs (e.g. gate) are skipped; key off sync only.
    if: ${{ needs.sync.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Market Facts Health Check (US)
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
        run: |
          python backend/scripts/market_facts_healthcheck.py --market US --strict

  # Step 2: 验证历史预测 (按市场切片执行)
  verify:
    needs: [sync, healthcheck]
    if: ${{ needs.sync.result == 'success' && needs.healthcheck.result == 'success' }}
    uses: ./.github/workflows/verify_predictions.yml
    with:
      market: 'US'
    secrets: inherit

  # Step 3: AI 分析 (仅当同步与健康检查均通过时执行)
  analyze:
    needs: [sync, healthcheck]
    if: ${{ needs.sync.result == 'success' && needs.healthcheck.result == 'success' }}
    uses: ./.github/workflows/ai_analyze_us.yml
    secrets: inherit
