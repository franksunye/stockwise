name: Tradeability Post-Close Pipeline

on:
  schedule:
    - cron: '5 11 * * 1-5'   # CN research orchestration after 19:00 BJT
    - cron: '35 11 * * 1-5'  # HK research orchestration after 19:00 BJT
  workflow_dispatch:
    inputs:
      market:
        description: 'Target market'
        type: choice
        required: true
        default: 'BOTH'
        options:
        - CN
        - HK
        - BOTH
      cn_target_symbols:
        description: 'CN nightly sample symbols'
        type: number
        required: false
        default: 150
      hk_target_symbols:
        description: 'HK nightly sample symbols'
        type: number
        required: false
        default: 80
      history_start_date:
        description: 'History floor (YYYY-MM-DD)'
        type: string
        required: false
        default: '2024-01-01'
      incremental_buffer_days:
        description: 'Replay buffer days for partially synced symbols'
        type: number
        required: false
        default: 14
      max_workers:
        description: 'Worker count'
        type: number
        required: false
        default: 2
      strategy_versions:
        description: 'Comma-separated sidecar strategy versions'
        type: string
        required: false
        default: 'tradeability_v1,tradeability_v2'
      dry_run:
        description: 'Dry run sidecar without DB writes'
        type: boolean
        required: false
        default: false
      sync_meta:
        description: 'Refresh stock_meta before sample sync'
        type: boolean
        required: false
        default: false
      cn_research_pool_manifest:
        description: 'Repo-relative CN research-pool manifest path'
        type: string
        required: false
        default: 'backend/strategy_config/research_pool/cn_core_500.json'

concurrency:
  group: tradeability-postclose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate_cn:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'CN'
    secrets: inherit

  gate_hk:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'HK'
    secrets: inherit

  sample-sync-cn:
    needs: [gate_cn]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' && (inputs.market == 'CN' || inputs.market == 'BOTH') ||
        github.event_name == 'schedule' && needs.gate_cn.outputs.should_run == 'true' && github.event.schedule == '5 11 * * 1-5'
      )
    uses: ./.github/workflows/tradeability_sample_sync_daily.yml
    with:
      market: 'CN'
      cn_target_symbols: ${{ inputs.cn_target_symbols || 150 }}
      history_start_date: ${{ inputs.history_start_date || '2024-01-01' }}
      incremental_buffer_days: ${{ inputs.incremental_buffer_days || 14 }}
      max_workers: ${{ inputs.max_workers || 2 }}
      sync_meta: ${{ inputs.sync_meta || false }}
      research_pool_manifest: ${{ inputs.cn_research_pool_manifest || 'backend/strategy_config/research_pool/cn_core_500.json' }}
    secrets: inherit

  sidecar-cn:
    needs: [sample-sync-cn]
    if: success()
    uses: ./.github/workflows/tradeability_sidecar_daily.yml
    with:
      market: 'CN'
      strategy_versions: ${{ inputs.strategy_versions || 'tradeability_v1,tradeability_v2' }}
      dry_run: ${{ inputs.dry_run || false }}
      research_pool_manifest: ${{ inputs.cn_research_pool_manifest || 'backend/strategy_config/research_pool/cn_core_500.json' }}
    secrets: inherit

  sample-sync-hk:
    needs: [gate_hk]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH') ||
        github.event_name == 'schedule' && needs.gate_hk.outputs.should_run == 'true' && github.event.schedule == '35 11 * * 1-5'
      )
    uses: ./.github/workflows/tradeability_sample_sync_daily.yml
    with:
      market: 'HK'
      hk_target_symbols: ${{ inputs.hk_target_symbols || 80 }}
      history_start_date: ${{ inputs.history_start_date || '2024-01-01' }}
      incremental_buffer_days: ${{ inputs.incremental_buffer_days || 14 }}
      max_workers: ${{ inputs.max_workers || 2 }}
      sync_meta: ${{ inputs.sync_meta || false }}
    secrets: inherit

  sidecar-hk:
    needs: [sample-sync-hk]
    if: success()
    uses: ./.github/workflows/tradeability_sidecar_daily.yml
    with:
      market: 'HK'
      strategy_versions: ${{ inputs.strategy_versions || 'tradeability_v1,tradeability_v2' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  notify-summary:
    needs:
      - gate_cn
      - gate_hk
      - sample-sync-cn
      - sidecar-cn
      - sample-sync-hk
      - sidecar-hk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Notify ADMIN Summary
        env:
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          MARKET_INPUT: ${{ inputs.market || 'AUTO' }}
          DRY_RUN_INPUT: ${{ inputs.dry_run || false }}
          GATE_CN_RESULT: ${{ needs.gate_cn.result || 'skipped' }}
          GATE_HK_RESULT: ${{ needs.gate_hk.result || 'skipped' }}
          SAMPLE_SYNC_CN_RESULT: ${{ needs.sample-sync-cn.result || 'skipped' }}
          SIDECAR_CN_RESULT: ${{ needs.sidecar-cn.result || 'skipped' }}
          SAMPLE_SYNC_HK_RESULT: ${{ needs.sample-sync-hk.result || 'skipped' }}
          SIDECAR_HK_RESULT: ${{ needs.sidecar-hk.result || 'skipped' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SOURCE: ${{ github.event_name }}
        run: |
          STATUS="success"
          MESSAGE="CN/HK 夜间研究链已完成"
          for result in "$SAMPLE_SYNC_CN_RESULT" "$SIDECAR_CN_RESULT" "$SAMPLE_SYNC_HK_RESULT" "$SIDECAR_HK_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              STATUS="failed"
              MESSAGE="Tradeability 夜间编排存在失败或取消的分支，请按摘要排查"
              break
            fi
          done

          python -u backend/scripts/send_admin_workflow_notification.py \
            --task-name "Tradeability 夜间编排" \
            --status "$STATUS" \
            --message "$MESSAGE" \
            --rerun-workflow "tradeability_postclose_pipeline.yml" \
            --meta workflow=tradeability_postclose_pipeline.yml \
            --meta trigger_source="$TRIGGER_SOURCE" \
            --meta market="$MARKET_INPUT" \
            --meta dry_run="$DRY_RUN_INPUT" \
            --meta gate_cn="$GATE_CN_RESULT" \
            --meta gate_hk="$GATE_HK_RESULT" \
            --meta sample_sync_cn="$SAMPLE_SYNC_CN_RESULT" \
            --meta sidecar_cn="$SIDECAR_CN_RESULT" \
            --meta sample_sync_hk="$SAMPLE_SYNC_HK_RESULT" \
            --meta sidecar_hk="$SIDECAR_HK_RESULT" \
            --meta run_url="$RUN_URL"
