name: Daily SEO Search Snapshot

on:
  schedule:
    # ~07:35 Asia/Shanghai · after Daily Growth Snapshot (cron 23:00 UTC)
    - cron: '35 23 * * *'
  workflow_dispatch:

jobs:
  ingest-seo-search-gsc:
    runs-on: ubuntu-latest
    env:
      DB_SOURCE: cloud
      TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
      GSC_SITE_SCOPE: ${{ secrets.GSC_SITE_SCOPE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare Google service-account JSON
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GA4_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p backend/keys
            printf '%s' "$GA4_SERVICE_ACCOUNT_JSON" > backend/keys/ga4-service-account.json
            echo "GA4_CREDENTIALS_PATH=backend/keys/ga4-service-account.json" >> "$GITHUB_ENV"
          fi

      - name: Ingest Search Console → seo_search_performance
        env:
          GSC_INCLUDE_QUERIES: '0'
        run: |
          if [ -z "$GSC_SITE_SCOPE" ]; then
            echo "❌ Missing secret GSC_SITE_SCOPE (Search Console property id, e.g. sc-domain:ziso.cc)"
            exit 1
          fi
          python backend/scripts/daily_seo_search_ingest.py --persist

      - name: Verify latest GSC rows
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, os.path.abspath("backend"))

          from database import get_connection

          conn = get_connection()
          cur = conn.cursor()
          cur.execute(
              """
              SELECT MAX(report_date) AS d,
                     SUM(CASE WHEN granularity = 'page' THEN 1 ELSE 0 END) AS pages,
                     SUM(CASE WHEN granularity = 'query' THEN 1 ELSE 0 END) AS qs
              FROM seo_search_performance
              WHERE source = 'gsc'
              """
          )
          row = cur.fetchone()
          conn.close()
          print({"gsc_latest_date": row[0], "gsc_rows_page": row[1], "gsc_rows_query": row[2]})
          PY
