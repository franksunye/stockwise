name: Daily Brief & Push (Global)

# 职责：每日生成 AI 简报并推送给订阅用户
# 触发：手动触发 (线上自动触发暂禁用，待本地验证稳定后启用)
# 启用定时: 取消下方 schedule 注释

on:
  schedule:
    - cron: '30 9 * * 1-5'  # CST 17:30 (M-F)
  workflow_dispatch:
    inputs:
      symbols:
        description: '指定个股代码 (逗号分隔，如 00700,300059)'
        type: string
        required: false
      user:
        description: '指定特定用户 ID'
        type: string
        required: false
      date:
        description: '指定日期 (YYYY-MM-DD)'
        type: string
        required: false
      force:
        description: '强制重新生成'
        type: boolean
        default: false

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Briefs (Phase 1 & 2)
        env:
          # Database (Turso)
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          
          # Tavily News
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          
          # Tiered LLM Providers
          BRIEF_PROVIDER_FREE: hunyuan
          BRIEF_PROVIDER_PRO: aliyun
          
          # API Keys
          ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
          
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 1. 生成每日简报并汇总
          SYMBOLS_ARG="${{ github.event.inputs.symbols != '' && format('--symbols {0}', github.event.inputs.symbols) || '' }}"
          USER_ARG="${{ github.event.inputs.user != '' && format('--user {0}', github.event.inputs.user) || '' }}"
          DATE_ARG="${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }}"
          FORCE_ARG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          
          python -m backend.engine.brief_generator $SYMBOLS_ARG $USER_ARG $DATE_ARG $FORCE_ARG
      - name: Broadcast Notifications
        if: github.event_name == 'schedule' || (github.event.inputs.symbols == '' && github.event.inputs.user == '')
        env:
          # Database
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          
          # Push Service
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          # Send pushes based on generated briefs
          DATE_ARG="${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }}"
          python backend/notifications.py --action push_daily $DATE_ARG
