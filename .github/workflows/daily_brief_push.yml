name: Daily Brief & Push (Global)

# 职责：每日生成 AI 简报并推送给订阅用户
# 触发：每交易日北京时间 17:30 自动执行
# 安全：通过 Trading Day Gate 闸门确保仅在交易日执行

on:
  # schedule:
  #   - cron: '30 9 * * 1-5'  # CST 17:30 (M-F)
  workflow_dispatch:
    inputs:
      symbols:
        description: '指定个股代码 (逗号分隔，如 00700,300059)'
        type: string
        required: false
      user:
        description: '指定特定用户 ID'
        type: string
        required: false
      date:
        description: '指定日期 (YYYY-MM-DD)'
        type: string
        required: false
      force:
        description: '强制重新生成 (同时跳过交易日检查)'
        type: boolean
        default: false
      send_legacy_batch_push:
        description: '是否额外执行旧版批量广播（默认关闭，仅用于人工补发）'
        type: boolean
        default: false

jobs:
  # Step 0: Trading Day Gate (仅 schedule 触发时检查)
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'ALL'
    secrets: inherit

  # Step 1: Generate and Push
  generate-and-push:
    needs: [gate]
    # 仅在交易日执行，或手动触发直接放行
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Log Gate Decision
        if: github.event_name == 'schedule'
        run: |
          echo "📅 Trading Day Gate: ${{ needs.gate.outputs.reason }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Briefs (Phase 1 & 2)
        env:
          # Database (Turso)
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          
          # Tavily News
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          
          # Tiered LLM Providers
          BRIEF_PROVIDER_FREE: hunyuan
          BRIEF_PROVIDER_PRO: aliyun
          
          # Canonical provider-scoped keys (preferred)
          LLM_PROVIDER__ALIYUN_DASHSCOPE__API_KEY: ${{ secrets.LLM_PROVIDER__ALIYUN_DASHSCOPE__API_KEY }}
          LLM_PROVIDER__ALIYUN_DASHSCOPE__BASE_URL: ${{ secrets.LLM_PROVIDER__ALIYUN_DASHSCOPE__BASE_URL }}
          LLM_PROVIDER__TENCENT_HUNYUAN__API_KEY: ${{ secrets.LLM_PROVIDER__TENCENT_HUNYUAN__API_KEY }}
          LLM_PROVIDER__GEMINI_LOCAL__API_KEY: ${{ secrets.LLM_PROVIDER__GEMINI_LOCAL__API_KEY }}
          LLM_PROVIDER__GEMINI_LOCAL__BASE_URL: ${{ secrets.LLM_PROVIDER__GEMINI_LOCAL__BASE_URL }}
          LLM_PROVIDER__DEEPSEEK_OFFICIAL__API_KEY: ${{ secrets.LLM_PROVIDER__DEEPSEEK_OFFICIAL__API_KEY }}
          LLM_PROVIDER__DEEPSEEK_OFFICIAL__BASE_URL: ${{ secrets.LLM_PROVIDER__DEEPSEEK_OFFICIAL__BASE_URL }}
          
          # Notification Secrets
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
        run: |
          # 1. 生成每日简报并汇总
          ARGS=()
          if [ -n "${{ github.event.inputs.symbols }}" ]; then ARGS+=(--symbols "${{ github.event.inputs.symbols }}"); fi
          if [ -n "${{ github.event.inputs.user }}" ]; then ARGS+=(--user "${{ github.event.inputs.user }}"); fi
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS+=(--date "${{ github.event.inputs.date }}"); fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS+=(--force); fi

          python -m backend.engine.brief_generator "${ARGS[@]}"
      - name: Broadcast Notifications
        if: github.event.inputs.send_legacy_batch_push == 'true'
        env:
          # Database
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          
          # Push Service
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          # Send pushes based on generated briefs
          DATE_ARGS=()
          if [ -n "${{ github.event.inputs.date }}" ]; then DATE_ARGS+=(--date "${{ github.event.inputs.date }}"); fi
          python backend/notifications.py --action push_daily "${DATE_ARGS[@]}"
