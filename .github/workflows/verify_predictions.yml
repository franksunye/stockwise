name: Verify AI Predictions

# 职责：验证历史 AI 预测的准确性 (T+1 验证)
# 这是一个通用组件，被 Daily Pipeline 调用

on:
  workflow_call:
    inputs:
      force:
        description: '强制重新验证所有预测'
        type: boolean
        default: false
        required: false
      date:
        description: '指定重跑分析日期 (YYYY-MM-DD)'
        type: string
        required: false
      market:
        description: '只验证指定市场 (CN/HK)，默认全市场'
        type: string
        required: false
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新验证所有预测'
        type: boolean
        default: false
        required: false
      date:
        description: '指定重跑分析日期 (YYYY-MM-DD)'
        type: string
        required: false
      market:
        description: '只验证指定市场 (CN/HK)，默认全市场'
        type: string
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Global Verification
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
        run: |
          FORCE_ARGS=()
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARGS+=(--force)
          fi
          DATE_ARGS=()
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARGS+=(--date "${{ inputs.date }}")
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARGS+=(--date "${{ github.event.inputs.date }}")
          fi
          MARKET_ARGS=()
          if [ -n "${{ inputs.market }}" ]; then
            MARKET_ARGS+=(--market "${{ inputs.market }}")
          elif [ -n "${{ github.event.inputs.market }}" ]; then
            MARKET_ARGS+=(--market "${{ github.event.inputs.market }}")
          fi
          python -u backend/main.py --verify "${FORCE_ARGS[@]}" "${DATE_ARGS[@]}" "${MARKET_ARGS[@]}"
