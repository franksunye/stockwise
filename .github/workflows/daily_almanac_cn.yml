name: Daily Market Almanac - A-Share (CN)

# 职责：仅负责 A 股 T+1 黄历生成、校验与预览广播

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (YYYY-MM-DD, optional)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      date:
        description: 'Target Date (YYYY-MM-DD, optional)'
        type: string
        required: false
        default: ''

concurrency:
  group: daily-almanac-cn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  almanac-cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Market Almanac
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          echo "🚀 Generating Daily Market Almanac for A-Share..."
          python -u backend/engine/almanac_generator.py $DATE_ARG

      - name: Market Facts Health Check (CN)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          python -u backend/scripts/market_facts_healthcheck.py --market CN $DATE_ARG

      - name: Broadcast Market Almanac Preview
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          echo "📜 Sending T+1 Almanac Preview to users..."
          python -u backend/scripts/broadcast_almanac.py --phase preview $DATE_ARG
