name: Tradeability Shadow Universe Experiment

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Target market"
        type: choice
        required: true
        default: "CN"
        options:
        - CN
      manifest_path:
        description: "Repo-relative shadow universe manifest path"
        type: string
        required: true
        default: "backend/strategy_config/shadow_universe/cn_top30_shadow.json"
      start_date:
        description: "YYYY-MM-DD"
        type: string
        required: true
        default: "2026-02-28"
      end_date:
        description: "YYYY-MM-DD"
        type: string
        required: true
        default: "2026-03-06"
      force:
        description: "Force overwrite existing shadow rows"
        type: boolean
        required: false
        default: false

jobs:
  shadow-experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Shadow Universe Backfill
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p tmp/shadow_universe
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -u backend/scripts/run_shadow_universe_light_backfill.py \
            --manifest "${{ inputs.manifest_path }}" \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            $FORCE_FLAG | tee tmp/shadow_universe/backfill.json

      - name: Summarize Shadow Experiment
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -u backend/scripts/summarize_shadow_universe_results.py \
            --market "${{ inputs.market }}" \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --output-json tmp/shadow_universe/summary.json | tee /tmp/shadow_summary.out
          cat /tmp/shadow_summary.out

      - name: Upload Shadow Experiment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeability-shadow-universe-experiment
          path: tmp/shadow_universe/*
          if-no-files-found: error
          retention-days: 21
