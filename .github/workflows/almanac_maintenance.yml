name: Almanac - Manual Maintenance

# 职责：手动生成或重跑历史黄历数据
# 场景：数据错误、补跑缺席日期、或者重新应用全新的文案模板到历史数据

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '任务模式'
        required: true
        type: choice
        options:
          - single-date # 单日
          - date-range  # 日期范围
      date:
        description: '单日模式: 日期 (YYYY-MM-DD), 留空则为最新交易日'
        required: false
        type: string
      start_date:
        description: '范围模式: 开始日期 (YYYY-MM-DD)'
        required: false
        type: string
      end_date:
        description: '范围模式: 结束日期 (YYYY-MM-DD)'
        required: false
        type: string

jobs:
  almanac-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Almanac Generator
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" == "single-date" ]; then
            DATE_ARGS=()
            if [ -n "${{ inputs.date }}" ]; then
              DATE_ARGS+=(--date "${{ inputs.date }}")
            fi
            echo "🚀 Executing: python backend/engine/almanac_generator.py ${DATE_ARGS[*]}"
            python -u backend/engine/almanac_generator.py "${DATE_ARGS[@]}"
          else
            echo "🚀 Executing: python backend/engine/almanac_generator.py --start-date ${{ inputs.start_date }} --end-date ${{ inputs.end_date }}"
            python -u backend/engine/almanac_generator.py --start-date ${{ inputs.start_date }} --end-date ${{ inputs.end_date }}
          fi

      - name: Market Facts Health Check (CN)
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
        run: |
          DATE_ARGS=()
          if [ "${{ inputs.mode }}" == "single-date" ] && [ -n "${{ inputs.date }}" ]; then
            DATE_ARGS+=(--date "${{ inputs.date }}")
          elif [ "${{ inputs.mode }}" == "date-range" ] && [ -n "${{ inputs.end_date }}" ]; then
            DATE_ARGS+=(--date "${{ inputs.end_date }}")
          fi
          python -u backend/scripts/market_facts_healthcheck.py --market CN "${DATE_ARGS[@]}"

      - name: Notify ADMIN Summary
        if: always()
        env:
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          MODE_INPUT: ${{ inputs.mode }}
          DATE_INPUT: ${{ inputs.date }}
          START_DATE_INPUT: ${{ inputs.start_date }}
          END_DATE_INPUT: ${{ inputs.end_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SOURCE: ${{ github.event_name }}
        run: |
          STATUS="${{ job.status }}"
          MESSAGE="黄历历史补跑已完成"
          if [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; then
            STATUS="failed"
            MESSAGE="黄历历史补跑失败或被取消，请排查"
          else
            STATUS="success"
          fi

          python -u backend/scripts/send_admin_workflow_notification.py \
            --task-name "黄历历史补跑" \
            --status "$STATUS" \
            --message "$MESSAGE" \
            --rerun-workflow "almanac_maintenance.yml" \
            --meta workflow=almanac_maintenance.yml \
            --meta trigger_source="$TRIGGER_SOURCE" \
            --meta mode="$MODE_INPUT" \
            --meta date="$DATE_INPUT" \
            --meta start_date="$START_DATE_INPUT" \
            --meta end_date="$END_DATE_INPUT" \
            --meta run_url="$RUN_URL"
