name: Daily Validation Glory Push - CN/HK (Smart)

# 职责：每日收盘后基于已验证结果发送“命中战报”（A 股与港股）
# 触发：北京时间 17:30 (M-F)
# 安全：通过 Trading Day Gate 闸门确保仅在交易日执行

on:
  schedule:
    - cron: '30 9 * * 1-5'  # 09:30 UTC = 17:30 CST
  workflow_dispatch:
    inputs:
      run_verify:
        description: '手动触发时是否先执行 verify_all_pending（默认关闭，避免与主链重复）'
        type: boolean
        default: false
        required: false

jobs:
  # Step 0: Trading Day Gate (仅 schedule 触发时检查)
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'ALL'
    secrets: inherit

  # Step 1: Validation Glory Push
  glory-push:
    needs: [gate]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Log Gate Decision
        if: github.event_name == 'schedule'
        run: |
          echo "📅 Trading Day Gate: ${{ needs.gate.outputs.reason }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run CN Validation Glory Push
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          ENABLE_SMART_NOTIFICATIONS: "true"
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
        run: |
          ARGS=(--market CN)
          if [ "${{ inputs.run_verify }}" = "true" ]; then
            ARGS+=(--run-verify)
          fi
          python backend/scripts/daily_validation_check.py "${ARGS[@]}"

      - name: Run HK Validation Glory Push
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          ENABLE_SMART_NOTIFICATIONS: "true"
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
        run: |
          ARGS=(--market HK)
          if [ "${{ inputs.run_verify }}" = "true" ]; then
            ARGS+=(--run-verify)
          fi
          python backend/scripts/daily_validation_check.py "${ARGS[@]}"
