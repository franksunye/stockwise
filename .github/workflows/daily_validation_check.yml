name: Daily Validation Check (Smart)

# 职责：每日收盘后校验 AI 预测准确度并发送成功战报
# 触发：北京时间 17:30 (M-F)
# 安全：通过 Trading Day Gate 闸门确保仅在交易日执行

on:
  schedule:
    - cron: '30 9 * * 1-5'  # 09:30 UTC = 17:30 CST
  workflow_dispatch:

jobs:
  # Step 0: Trading Day Gate (仅 schedule 触发时检查)
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'ALL'
    secrets: inherit

  # Step 1: Validation Check
  validation-check:
    needs: [gate]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Log Gate Decision
        if: github.event_name == 'schedule'
        run: |
          echo "📅 Trading Day Gate: ${{ needs.gate.outputs.reason }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Validation Check
        env:
          # Database (Turso)
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          
          # Push Service
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          
          # Logic Control
          ENABLE_SMART_NOTIFICATIONS: "true"
          
          # Notification Secrets
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
        run: |
          python backend/scripts/daily_validation_check.py
