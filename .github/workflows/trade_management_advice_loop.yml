name: Trade Management Advice Loop

on:
  schedule:
    # 每个工作日北京时间 20:30 触发一次；实际是否执行由 CN/HK 市场闸门决定
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Optional user id filter'
        type: string
        required: false
        default: ''
      symbol:
        description: 'Optional symbol filter'
        type: string
        required: false
        default: ''
      market:
        description: 'Optional market filter'
        type: choice
        required: false
        default: 'ALL'
        options:
          - ALL
          - CN
          - HK
      notify:
        description: 'Send cards to webhook and @ADMIN'
        type: boolean
        required: false
        default: true
      force:
        description: 'Force run even if selected market is closed'
        type: boolean
        required: false
        default: false

concurrency:
  group: trade-management-advice-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-cn:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.market == 'ALL' || inputs.market == 'CN'))
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'CN'
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit

  gate-hk:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.market == 'ALL' || inputs.market == 'HK'))
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'HK'
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit

  advice-cn:
    needs: [gate-cn]
    if: |
      always() && needs.gate-cn.result != 'skipped' && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate-cn.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Trade Management Advice Loop (CN)
        env:
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          USER_ID_INPUT: ${{ inputs.user_id || '' }}
          SYMBOL_INPUT: ${{ inputs.symbol || '' }}
          NOTIFY_INPUT: ${{ inputs.notify }}
        run: |
          ARGS="--persist-log --fail-on-errors --market CN"
          if [ -n "$USER_ID_INPUT" ]; then
            ARGS="$ARGS --user-id $USER_ID_INPUT"
          fi
          if [ -n "$SYMBOL_INPUT" ]; then
            ARGS="$ARGS --symbol $SYMBOL_INPUT"
          fi
          if [ "$NOTIFY_INPUT" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --notify"
          fi

          python -u backend/scripts/run_trade_management_advice_loop.py $ARGS

  advice-hk:
    needs: [gate-hk]
    if: |
      always() && needs.gate-hk.result != 'skipped' && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate-hk.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Trade Management Advice Loop (HK)
        env:
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          USER_ID_INPUT: ${{ inputs.user_id || '' }}
          SYMBOL_INPUT: ${{ inputs.symbol || '' }}
          NOTIFY_INPUT: ${{ inputs.notify }}
        run: |
          ARGS="--persist-log --fail-on-errors --market HK"
          if [ -n "$USER_ID_INPUT" ]; then
            ARGS="$ARGS --user-id $USER_ID_INPUT"
          fi
          if [ -n "$SYMBOL_INPUT" ]; then
            ARGS="$ARGS --symbol $SYMBOL_INPUT"
          fi
          if [ "$NOTIFY_INPUT" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --notify"
          fi

          python -u backend/scripts/run_trade_management_advice_loop.py $ARGS

  notify-failure:
    needs: [gate-cn, gate-hk, advice-cn, advice-hk]
    if: |
      always() && (
        needs.advice-cn.result == 'failure' ||
        needs.advice-hk.result == 'failure'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Notify ADMIN Failure
        env:
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_CN_REASON: ${{ needs.gate-cn.outputs.reason || 'skipped' }}
          GATE_HK_REASON: ${{ needs.gate-hk.outputs.reason || 'skipped' }}
          ADVICE_CN_RESULT: ${{ needs.advice-cn.result || 'skipped' }}
          ADVICE_HK_RESULT: ${{ needs.advice-hk.result || 'skipped' }}
        run: |
          python -u backend/scripts/send_admin_workflow_notification.py \
            --task-name "交易管理建议闭环" \
            --status "failed" \
            --message "Trade management advice loop 存在失败市场分支，请排查 market gate 与 advice runner" \
            --rerun-workflow "trade_management_advice_loop.yml" \
            --meta workflow=trade_management_advice_loop.yml \
            --meta advice_cn="$ADVICE_CN_RESULT" \
            --meta advice_hk="$ADVICE_HK_RESULT" \
            --meta gate_cn="$GATE_CN_REASON" \
            --meta gate_hk="$GATE_HK_REASON" \
            --meta run_url="$RUN_URL"
