name: Trade Management Advice Loop

on:
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Optional user id filter'
        type: string
        required: false
        default: ''
      symbol:
        description: 'Optional symbol filter'
        type: string
        required: false
        default: ''
      market:
        description: 'Optional market filter'
        type: string
        required: false
        default: ''
      notify:
        description: 'Send cards to webhook and @ADMIN'
        type: boolean
        required: false
        default: true

jobs:
  advice-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Trade Management Advice Loop
        env:
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          USER_ID_INPUT: ${{ inputs.user_id || '' }}
          SYMBOL_INPUT: ${{ inputs.symbol || '' }}
          MARKET_INPUT: ${{ inputs.market || '' }}
          NOTIFY_INPUT: ${{ inputs.notify }}
        run: |
          ARGS="--persist-log --fail-on-errors"
          if [ -n "$USER_ID_INPUT" ]; then
            ARGS="$ARGS --user-id $USER_ID_INPUT"
          fi
          if [ -n "$SYMBOL_INPUT" ]; then
            ARGS="$ARGS --symbol $SYMBOL_INPUT"
          fi
          if [ -n "$MARKET_INPUT" ]; then
            ARGS="$ARGS --market $MARKET_INPUT"
          fi
          if [ "$NOTIFY_INPUT" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --notify"
          fi

          python -u backend/scripts/run_trade_management_advice_loop.py $ARGS

      - name: Notify ADMIN Failure
        if: failure()
        env:
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -u backend/scripts/send_admin_workflow_notification.py \
            --task-name "交易管理建议闭环" \
            --status "failed" \
            --message "Trade management advice loop 执行失败，请排查 active 持仓与 webhook 配置" \
            --rerun-workflow "trade_management_advice_loop.yml" \
            --meta workflow=trade_management_advice_loop.yml \
            --meta run_url="$RUN_URL"
