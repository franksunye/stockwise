name: Acceptance Weekly Snapshot

on:
  schedule:
    - cron: "10 2 * * 0"
  workflow_dispatch:
    inputs:
      week_end:
        description: "YYYY-MM-DD (optional)"
        type: string
        required: false
        default: ""
      market:
        description: "Market"
        type: choice
        required: false
        default: "CN"
        options:
        - CN
        - HK
      strategy_version:
        description: "Strategy version"
        type: string
        required: false
        default: "tradeability_v2"
      notify:
        description: "Send webhook summary"
        type: boolean
        required: false
        default: true

jobs:
  weekly-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Weekly Acceptance Report
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
        run: |
          mkdir -p tmp/acceptance_metrics
          END_ARGS=()
          if [ -n "${{ inputs.week_end }}" ]; then
            END_ARGS+=(--week-end "${{ inputs.week_end }}")
          fi
          MARKET_ARGS=(--market CN)
          if [ -n "${{ inputs.market }}" ]; then
            MARKET_ARGS=(--market "${{ inputs.market }}")
          fi
          STRATEGY_ARGS=(--strategy-version tradeability_v2)
          if [ -n "${{ inputs.strategy_version }}" ]; then
            STRATEGY_ARGS=(--strategy-version "${{ inputs.strategy_version }}")
          fi
          NOTIFY_ARGS=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.notify }}" = "true" ]; then
            NOTIFY_ARGS+=(--notify)
          fi
          python -u backend/scripts/metrics_acceptance_weekly.py \
            "${END_ARGS[@]}" \
            "${MARKET_ARGS[@]}" \
            "${STRATEGY_ARGS[@]}" \
            --output-json tmp/acceptance_metrics/acceptance_weekly.json \
            --output-md tmp/acceptance_metrics/acceptance_weekly.md \
            "${NOTIFY_ARGS[@]}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-weekly-snapshot
          path: tmp/acceptance_metrics/acceptance_weekly.*
          if-no-files-found: error
          retention-days: 21
