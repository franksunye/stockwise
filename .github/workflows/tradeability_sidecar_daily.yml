name: Tradeability Sidecar Daily

on:
  schedule:
    # After CN/HK daily pipelines complete
    - cron: '50 8 * * 1-5'  # CN sidecar
    - cron: '20 9 * * 1-5'  # HK sidecar
  workflow_dispatch:
    inputs:
      market:
        description: 'Target market'
        type: choice
        required: true
        default: 'CN'
        options:
        - CN
        - HK
        - BOTH
      date:
        description: 'YYYY-MM-DD (optional, default latest trading date by market)'
        type: string
        required: false
        default: ''
      strategy_version:
        description: 'Sidecar strategy version'
        type: string
        required: false
        default: 'tradeability_v1'
      dry_run:
        description: 'Dry run without DB writes'
        type: boolean
        required: false
        default: false

concurrency:
  group: tradeability-sidecar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate_cn:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'CN'
    secrets: inherit

  gate_hk:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'HK'
    secrets: inherit

  run-cn:
    runs-on: ubuntu-latest
    needs: [gate_cn]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' && (inputs.market == 'CN' || inputs.market == 'BOTH') ||
        github.event_name == 'schedule' && needs.gate_cn.outputs.should_run == 'true' && github.event.schedule == '50 8 * * 1-5'
      )
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Sidecar CN
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          STRATEGY="${{ inputs.strategy_version }}"
          if [ -z "$STRATEGY" ]; then
            STRATEGY="tradeability_v1"
          fi
          python -u backend/scripts/run_tradeability_sidecar.py --market CN --strategy-version "$STRATEGY" $DATE_ARG $DRY_FLAG

  run-hk:
    runs-on: ubuntu-latest
    needs: [gate_hk]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH') ||
        github.event_name == 'schedule' && needs.gate_hk.outputs.should_run == 'true' && github.event.schedule == '20 9 * * 1-5'
      )
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Sidecar HK
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          STRATEGY="${{ inputs.strategy_version }}"
          if [ -z "$STRATEGY" ]; then
            STRATEGY="tradeability_v1"
          fi
          python -u backend/scripts/run_tradeability_sidecar.py --market HK --strategy-version "$STRATEGY" $DATE_ARG $DRY_FLAG
