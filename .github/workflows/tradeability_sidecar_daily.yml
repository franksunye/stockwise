name: Tradeability Sidecar Daily

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Target market'
        type: choice
        required: true
        default: 'CN'
        options:
        - CN
        - HK
        - BOTH
      date:
        description: 'YYYY-MM-DD (optional, default latest trading date by market)'
        type: string
        required: false
        default: ''
      strategy_versions:
        description: 'Comma-separated sidecar strategy versions'
        type: string
        required: false
        default: 'tradeability_v1,tradeability_v2'
      dry_run:
        description: 'Dry run without DB writes'
        type: boolean
        required: false
        default: false
      research_pool_manifest:
        description: 'Repo-relative research-pool manifest path'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      market:
        description: 'Target market'
        type: string
        required: true
      date:
        description: 'YYYY-MM-DD (optional, default latest trading date by market)'
        type: string
        required: false
        default: ''
      strategy_versions:
        description: 'Comma-separated sidecar strategy versions'
        type: string
        required: false
        default: 'tradeability_v1,tradeability_v2'
      dry_run:
        description: 'Dry run without DB writes'
        type: boolean
        required: false
        default: false
      research_pool_manifest:
        description: 'Repo-relative research-pool manifest path'
        type: string
        required: false
        default: ''

concurrency:
  group: tradeability-sidecar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-cn:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_call' && inputs.market == 'CN' ||
      github.event_name == 'workflow_dispatch' && (inputs.market == 'CN' || inputs.market == 'BOTH')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Sidecar CN
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          STRATEGIES="${{ inputs.strategy_versions }}"
          if [ -z "$STRATEGIES" ]; then
            STRATEGIES="tradeability_v1,tradeability_v2"
          fi
          MANIFEST_FLAG=""
          if [ -n "${{ inputs.research_pool_manifest }}" ]; then
            MANIFEST_FLAG="--research-pool-manifest ${{ inputs.research_pool_manifest }}"
          fi
          python -u backend/scripts/run_tradeability_sidecar.py --market CN --strategy-versions "$STRATEGIES" $DATE_ARG $DRY_FLAG $MANIFEST_FLAG

  run-hk:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_call' && inputs.market == 'HK' ||
      github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Sidecar HK
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          STRATEGIES="${{ inputs.strategy_versions }}"
          if [ -z "$STRATEGIES" ]; then
            STRATEGIES="tradeability_v1,tradeability_v2"
          fi
          MANIFEST_FLAG=""
          if [ -n "${{ inputs.research_pool_manifest }}" ]; then
            MANIFEST_FLAG="--research-pool-manifest ${{ inputs.research_pool_manifest }}"
          fi
          python -u backend/scripts/run_tradeability_sidecar.py --market HK --strategy-versions "$STRATEGIES" $DATE_ARG $DRY_FLAG $MANIFEST_FLAG

  notify-summary:
    needs: [run-cn, run-hk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Notify ADMIN Summary
        env:
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          MARKET_INPUT: ${{ inputs.market || 'AUTO' }}
          DRY_RUN_INPUT: ${{ inputs.dry_run || false }}
          RUN_CN_RESULT: ${{ needs.run-cn.result || 'skipped' }}
          RUN_HK_RESULT: ${{ needs.run-hk.result || 'skipped' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SOURCE: ${{ github.event_name }}
        run: |
          STATUS="success"
          MESSAGE="Tradeability sidecar 已完成"
          for result in "$RUN_CN_RESULT" "$RUN_HK_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              STATUS="failed"
              MESSAGE="Tradeability sidecar 存在失败或取消的分支，请排查"
              break
            fi
          done

          python -u backend/scripts/send_admin_workflow_notification.py \
            --task-name "Tradeability Sidecar" \
            --status "$STATUS" \
            --message "$MESSAGE" \
            --rerun-workflow "tradeability_sidecar_daily.yml" \
            --meta workflow=tradeability_sidecar_daily.yml \
            --meta trigger_source="$TRIGGER_SOURCE" \
            --meta market="$MARKET_INPUT" \
            --meta dry_run="$DRY_RUN_INPUT" \
            --meta sidecar_cn="$RUN_CN_RESULT" \
            --meta sidecar_hk="$RUN_HK_RESULT" \
            --meta run_url="$RUN_URL"
