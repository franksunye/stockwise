name: Tradeability Sidecar Daily

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Target market'
        type: choice
        required: true
        default: 'CN'
        options:
        - CN
        - HK
        - BOTH
      date:
        description: 'YYYY-MM-DD (optional, default latest trading date by market)'
        type: string
        required: false
        default: ''
      strategy_versions:
        description: 'Comma-separated sidecar strategy versions'
        type: string
        required: false
        default: 'tradeability_v1,tradeability_v2'
      dry_run:
        description: 'Dry run without DB writes'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      market:
        description: 'Target market'
        type: string
        required: true
      date:
        description: 'YYYY-MM-DD (optional, default latest trading date by market)'
        type: string
        required: false
        default: ''
      strategy_versions:
        description: 'Comma-separated sidecar strategy versions'
        type: string
        required: false
        default: 'tradeability_v1,tradeability_v2'
      dry_run:
        description: 'Dry run without DB writes'
        type: boolean
        required: false
        default: false

concurrency:
  group: tradeability-sidecar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-cn:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_call' && inputs.market == 'CN' ||
      github.event_name == 'workflow_dispatch' && (inputs.market == 'CN' || inputs.market == 'BOTH')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Sidecar CN
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          STRATEGIES="${{ inputs.strategy_versions }}"
          if [ -z "$STRATEGIES" ]; then
            STRATEGIES="tradeability_v1,tradeability_v2"
          fi
          python -u backend/scripts/run_tradeability_sidecar.py --market CN --strategy-versions "$STRATEGIES" $DATE_ARG $DRY_FLAG

  run-hk:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_call' && inputs.market == 'HK' ||
      github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Sidecar HK
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          STRATEGIES="${{ inputs.strategy_versions }}"
          if [ -z "$STRATEGIES" ]; then
            STRATEGIES="tradeability_v1,tradeability_v2"
          fi
          python -u backend/scripts/run_tradeability_sidecar.py --market HK --strategy-versions "$STRATEGIES" $DATE_ARG $DRY_FLAG
