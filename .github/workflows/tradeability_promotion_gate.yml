name: Tradeability Promotion Gate

on:
  schedule:
    - cron: "50 2 * * 0"
  workflow_dispatch:
    inputs:
      market:
        description: "Target market"
        type: choice
        required: true
        default: "CN"
        options:
        - CN
        - HK
        - BOTH
      candidate_version:
        description: "Candidate strategy version"
        type: string
        required: false
        default: "tradeability_v2"
      baseline_version:
        description: "Baseline strategy version"
        type: string
        required: false
        default: "tradeability_v1"
      week_end:
        description: "YYYY-MM-DD (optional)"
        type: string
        required: false
        default: ""
      lookback_weeks:
        description: "Rolling lookback weeks"
        type: number
        required: false
        default: 4
      min_pass_weeks:
        description: "Minimum consecutive pass weeks"
        type: number
        required: false
        default: 2
      notify:
        description: "Send webhook summary"
        type: boolean
        required: false
        default: true

jobs:
  promotion-cn:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.market == 'CN' || inputs.market == 'BOTH'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Weekly Calibration CN
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p tmp/tradeability_calibration tmp/tradeability_experiments tmp/tradeability_promotion
          python -u backend/scripts/run_tradeability_weekly_calibration.py \
            --market CN \
            --strategy-versions "${{ inputs.candidate_version || 'tradeability_v2' }},${{ inputs.baseline_version || 'tradeability_v1' }}" \
            --output-json tmp/tradeability_calibration/cn_weekly_calibration.json \
            --output-md tmp/tradeability_calibration/cn_weekly_calibration.md

      - name: Generate Weekly Experiment CN
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          END_ARGS=()
          if [ -n "${{ inputs.week_end }}" ]; then
            END_ARGS+=(--end-date "${{ inputs.week_end }}")
          fi
          python -u backend/scripts/run_tradeability_experiment.py \
            --market CN \
            --strategy-versions "${{ inputs.candidate_version || 'tradeability_v2' }},${{ inputs.baseline_version || 'tradeability_v1' }}" \
            "${END_ARGS[@]}" \
            --output-json tmp/tradeability_experiments/cn_strategy_experiment.json \
            --output-md tmp/tradeability_experiments/cn_strategy_experiment.md

      - name: Generate Promotion Verdict CN
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
        run: |
          WEEK_END_ARGS=()
          if [ -n "${{ inputs.week_end }}" ]; then
            WEEK_END_ARGS+=(--week-end "${{ inputs.week_end }}")
          fi
          NOTIFY_ARGS=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.notify }}" = "true" ]; then
            NOTIFY_ARGS+=(--notify)
          fi
          python -u backend/scripts/metrics_tradeability_promotion.py \
            --market CN \
            --candidate-version "${{ inputs.candidate_version || 'tradeability_v2' }}" \
            --baseline-version "${{ inputs.baseline_version || 'tradeability_v1' }}" \
            --lookback-weeks "${{ inputs.lookback_weeks || 4 }}" \
            --min-pass-weeks "${{ inputs.min_pass_weeks || 2 }}" \
            "${WEEK_END_ARGS[@]}" \
            --calibration-dir tmp/tradeability_calibration \
            --experiment-dir tmp/tradeability_experiments \
            --output-json tmp/tradeability_promotion/cn_promotion_verdict.json \
            --output-md tmp/tradeability_promotion/cn_promotion_verdict.md \
            "${NOTIFY_ARGS[@]}"

      - name: Upload CN Promotion Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeability-promotion-cn
          path: tmp/tradeability_promotion/cn_*
          if-no-files-found: error
          retention-days: 21

  promotion-hk:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH'))
