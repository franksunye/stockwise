name: Daily User Maintenance

on:
  schedule:
    # 每天北京时间凌晨 03:00 (UTC 19:00) 执行
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Scan only)'
        required: false
        type: boolean
        default: false

jobs:
  prune-expired-users:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          
      - name: Prune Expired Users
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔎 Running in DRY RUN mode..."
            python backend/scripts/prune_users.py --dry-run
          else
            echo "🧹 Running in ACTIVE mode..."
            python backend/scripts/prune_users.py
          fi
