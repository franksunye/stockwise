name: AI Analysis - A-Share (CN)

# 职责：仅负责 A股 AI 分析，不包含数据同步

on:
  workflow_dispatch: # 支持手动触发
    inputs:
      force:
        description: 'Force re-analysis (overwrite existing)'
        type: boolean
        required: false
        default: false
      date:
        description: 'Specify date (YYYY-MM-DD)'
        type: string
        required: false
        default: ''
      model:
        description: 'Specify Model to run (default: all)'
        type: choice
        required: false
        default: 'all'
        options:
        - all
        - hunyuan-lite
        - deepseek-v3
        - deepseek-v3.2-exp
        - gemini-3-flash
        - rule-engine
      locale:
        description: 'Prediction content locale (auto/cn/en)'
        type: choice
        required: false
        default: 'auto'
        options:
        - auto
        - cn
        - en
  workflow_call:     # 支持被其他 workflow 调用
    inputs:
      force:
        description: 'Force re-analysis'
        type: boolean
        required: false
        default: false
      date:
        description: 'Specify date'
        type: string
        required: false
        default: ''
      model:
        description: 'Specify Model'
        type: string
        required: false
        default: 'all'
      locale:
        description: 'Prediction content locale (auto/cn/en)'
        type: string
        required: false
        default: 'auto'

concurrency:
  group: ai-analyze-cn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-cn:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    name: analyze-cn-shard-${{ matrix.shard_index }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run AI Analysis for A-Share
        env:
          PYTHONUNBUFFERED: "1"
          # 数据库
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # AI 服务
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_ENABLED: ${{ secrets.LLM_ENABLED }}
          LLM_PROVIDER: aliyun
          # Canonical provider-scoped keys (preferred)
          LLM_PROVIDER__ALIYUN_DASHSCOPE__API_KEY: ${{ secrets.LLM_PROVIDER__ALIYUN_DASHSCOPE__API_KEY }}
          LLM_PROVIDER__ALIYUN_DASHSCOPE__BASE_URL: ${{ secrets.LLM_PROVIDER__ALIYUN_DASHSCOPE__BASE_URL }}
          # Canonical Tencent Hunyuan key
          LLM_PROVIDER__TENCENT_HUNYUAN__API_KEY: ${{ secrets.LLM_PROVIDER__TENCENT_HUNYUAN__API_KEY }}
          # Canonical Gemini Local key + proxy base URL
          LLM_PROVIDER__GEMINI_LOCAL__API_KEY: ${{ secrets.LLM_PROVIDER__GEMINI_LOCAL__API_KEY }}
          LLM_PROVIDER__GEMINI_LOCAL__BASE_URL: ${{ secrets.LLM_PROVIDER__GEMINI_LOCAL__BASE_URL }}
          # Canonical DeepSeek Official (kept for rollback model entries, even if inactive)
          LLM_PROVIDER__DEEPSEEK_OFFICIAL__API_KEY: ${{ secrets.LLM_PROVIDER__DEEPSEEK_OFFICIAL__API_KEY }}
          LLM_PROVIDER__DEEPSEEK_OFFICIAL__BASE_URL: ${{ secrets.LLM_PROVIDER__DEEPSEEK_OFFICIAL__BASE_URL }}
          # Canonical NVIDIA Integrate key + endpoint
          LLM_PROVIDER__NVIDIA__API_KEY: ${{ secrets.LLM_PROVIDER__NVIDIA__API_KEY }}
          LLM_PROVIDER__NVIDIA__BASE_URL: ${{ secrets.LLM_PROVIDER__NVIDIA__BASE_URL }}
          # AkShare stock flow guardrails (avoid single-symbol blocking the whole batch)
          AKSHARE_STOCK_FLOW_TIMEOUT_SEC: "12"
          AKSHARE_STOCK_FLOW_RETRIES: "1"
          
          # 通知
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          FORCE_ARGS=()
          if [ "${{ inputs.force }}" == "true" ]; then
            FORCE_ARGS+=(--force)
            echo "⚠️ Force mode enabled via input."
          else
            echo "ℹ️ Force mode disabled."
          fi

          DATE_ARGS=()
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARGS+=(--date "${{ inputs.date }}")
            echo "📅 Target date set to: ${{ inputs.date }}"
          fi
          
          if [ -z "${{ inputs.model }}" ]; then
            MODEL_ARGS=(--model all)
          else
            MODEL_ARGS=(--model "${{ inputs.model }}")
          fi

          LOCALE_VALUE="${{ inputs.locale }}"
          if [ -z "${LOCALE_VALUE}" ]; then
            LOCALE_VALUE="${{ github.event.inputs.locale }}"
          fi
          if [ -z "${LOCALE_VALUE}" ]; then
            LOCALE_VALUE="auto"
          fi
          LOCALE_ARGS=(--locale "${LOCALE_VALUE}")

          SHARD_ARGS=(--shard-index "${{ matrix.shard_index }}" --shard-total 4 --max-symbol-concurrency 1)

          echo "🚀 Executing: python -u backend/main.py --analyze --market CN ${MODEL_ARGS[*]} ${FORCE_ARGS[*]} ${DATE_ARGS[*]} ${LOCALE_ARGS[*]} ${SHARD_ARGS[*]}"
          python -u backend/main.py --analyze --market CN "${MODEL_ARGS[@]}" "${FORCE_ARGS[@]}" "${DATE_ARGS[@]}" "${LOCALE_ARGS[@]}" "${SHARD_ARGS[@]}"
