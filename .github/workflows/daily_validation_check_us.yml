name: Daily Validation Glory Push - US (Smart)

# 职责：美股收盘后发送“命中战报”
# 触发：北京时间 08:30 (Tue-Sat)，即美股周一至周五交易日结束后
# 安全：通过 Trading Day Gate 闸门确保仅在 US 交易日执行

on:
  # Trigger Source: Cloudflare Worker Only (08:30 BJT Post-Close)
  workflow_dispatch:
    inputs:
      run_verify:
        description: '是否补充执行 verify'
        type: boolean
        default: false

jobs:
  # Step 0: Trading Day Gate
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'US'
    secrets: inherit

  glory-push-us:
    needs: [gate]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run US Validation Glory Push
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          ENABLE_SMART_NOTIFICATIONS: "true"
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
          ADMIN_MOBILES: ${{ secrets.ADMIN_MOBILES }}
        run: |
          ARGS=(--market US)
          if [ "${{ inputs.run_verify }}" = "true" ]; then
            ARGS+=(--run-verify)
          fi
          python backend/scripts/daily_validation_check.py "${ARGS[@]}"
