name: Layer1 Consistency Daily

on:
  schedule:
    - cron: "40 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (optional)"
        type: string
        required: false
        default: ""
      notify:
        description: "Send webhook summary"
        type: boolean
        required: false
        default: true

jobs:
  daily-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Layer1 Consistency Report
        env:
          PYTHONUNBUFFERED: "1"
          DB_SOURCE: cloud
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
        run: |
          mkdir -p tmp/layer1_metrics
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          NOTIFY_ARG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.notify }}" = "true" ]; then
            NOTIFY_ARG="--notify"
          fi
          python -u backend/scripts/metrics_layer1_consistency.py \
            $DATE_ARG \
            --output-json tmp/layer1_metrics/layer1_consistency_daily.json \
            --output-md tmp/layer1_metrics/layer1_consistency_daily.md \
            $NOTIFY_ARG

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: layer1-consistency-daily
          path: tmp/layer1_metrics/layer1_consistency_daily.*
          if-no-files-found: error
          retention-days: 14
