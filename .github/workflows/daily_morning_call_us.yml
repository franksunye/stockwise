name: Daily Morning Call (US Market)

# 职责：每日美股开盘前发送个性化 AI 交易计划提醒
# 触发：北京时间 20:30 (M-F) -> UTC 12:30

on:
  # Trigger Source: Cloudflare Worker Only (20:30 BJT)
  # 调度权已全权移交给 Cloudflare Worker，以此确保全球调度一致性
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (YYYY-MM-DD), e.g., 2026-01-21'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run (Simulate only)'
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-morning-call-us-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Step 0: Trading Day Gate (仅 schedule 触发时检查)
  gate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/trading_day_gate.yml
    with:
      market: 'US'
    secrets: inherit

  morning-call:
    needs: [gate]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.gate.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Log Gate Decision
        if: github.event_name == 'schedule'
        run: |
          echo "📅 Trading Day Gate (US): ${{ needs.gate.outputs.reason }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run US Morning Call
        timeout-minutes: 10
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          ENABLE_SMART_NOTIFICATIONS: "true"
          TARGET_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          WECOM_ROBOT_KEY: ${{ secrets.WECOM_ROBOT_KEY }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$TARGET_DATE" ]; then ARGS+=(--date "$TARGET_DATE"); fi
          python backend/scripts/daily_morning_call.py --market US "${ARGS[@]}"
