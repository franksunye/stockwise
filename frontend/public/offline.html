<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZISO AI - 离线</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050508;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      opacity: 0.6;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: #e2e8f0;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.8125rem;
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 2rem;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.7; transform: scale(0.97); }
  </style>
</head>
<body>
  <img src="/logo.png" alt="ZISO AI" class="logo">
  <h1>当前无网络连接</h1>
  <p>请检查你的 Wi-Fi 或移动数据连接，恢复后即可继续使用 ZISO AI。</p>
  <button onclick="window.location.reload()">重试</button>
</body>
</html>
