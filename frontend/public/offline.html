<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZISO AI - 离线</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050508;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      opacity: 0.6;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: #e2e8f0;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.8125rem;
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 2rem;
    }

    .status {
      font-size: 0.6875rem;
      color: #475569;
      margin-bottom: 1rem;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.7;
      transform: scale(0.97);
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    .spinner.active {
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <img src="/logo.png" alt="ZISO AI" class="logo">
  <h1>当前无网络连接</h1>
  <p>请检查你的 Wi-Fi 或移动数据连接，恢复后即可继续使用 ZISO AI。</p>
  <div id="spinner" class="spinner"></div>
  <p id="status" class="status"></p>
  <button id="retry" onclick="retryConnection()">重试</button>

  <script>
    // 自动重试：当网络恢复时，自动刷新页面
    window.addEventListener('online', function () {
      document.getElementById('status').textContent = '网络已恢复，正在重新加载...';
      document.getElementById('spinner').classList.add('active');
      setTimeout(function () { window.location.reload(); }, 500);
    });

    function retryConnection() {
      var btn = document.getElementById('retry');
      var status = document.getElementById('status');
      var spinner = document.getElementById('spinner');

      btn.disabled = true;
      btn.textContent = '正在连接...';
      spinner.classList.add('active');
      status.textContent = '';

      // 尝试 fetch 首页来检测网络
      fetch('/', { cache: 'no-store' })
        .then(function (res) {
          if (res.ok) {
            status.textContent = '连接成功，正在加载...';
            window.location.replace('/');
          } else {
            throw new Error('Server error');
          }
        })
        .catch(function () {
          spinner.classList.remove('active');
          btn.disabled = false;
          btn.textContent = '重试';
          status.textContent = '仍然无法连接，请检查网络后再试';
        });
    }
  </script>
</body>

</html>
